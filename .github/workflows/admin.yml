# 管理の操作を GitHub の上から行う（手で動かす）。いまは「ここまでを本物として確かめ済みにする」だけ（管理画面の同じボタンと同じ）
name: admin
on:
  workflow_dispatch:
    inputs:
      ckpt:
        description: 'この層までを確かめ済みにする（層の番号）'
        required: true
permissions:
  contents: read
concurrency:
  group: el-admin
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 道具を入れる
        run: mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x" && npm init -y >/dev/null && npm i google-auth-library@9 --silent
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FT_BLUE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FT_BLUE_SERVICE_ACCOUNT が登録されていません"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: 確かめ済みにする
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          F: ${{ github.event.inputs.ckpt }}
        run: node tools/admin-ckpt.mjs "$F"
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
